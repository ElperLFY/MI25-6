name: JavaScript tests

on:
  push:
    branches:
      - main
      - feature/flexible-datasets
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: find JS tests vendor -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run test suite
        run: npm test
